name: Testing

on:
  pull_request:
    branches:
      - trunk

jobs:
  phpunit:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.2', '8.0', '7.4']
    services:
      database:
        image: mysql:latest
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpunit-polyfills:1.1
          extensions: mbstring, xml, zip, intl, pdo, mysql
          coverage: none

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion
        
      - name: Install Composer dependencies
        run: composer install --no-dev

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Install WooCommerce
        run: |
          cd $GITHUB_WORKSPACE/../
          # For PHP 8.0, use a compatible version of WooCommerce
          if [[ "${{ matrix.php-version }}" == "8.0" ]]; then
            curl -L -O https://downloads.wordpress.org/plugin/woocommerce.7.9.0.zip
            unzip -q woocommerce.7.9.0.zip
          else
            # For PHP 8.2 and 8.3, use the latest version
            curl -L -O https://downloads.wordpress.org/plugin/woocommerce.zip
            unzip -q woocommerce.zip
          fi
          test -f woocommerce/woocommerce.php

      - name: Run tests
        run: phpunit
